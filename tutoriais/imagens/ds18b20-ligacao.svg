<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="14">
  <title>Ligação do DS18B20 à prova d'água na ESP32</title>
  <defs>
    <style>
      .placa { fill: #1b3a5c; }
      .pino { fill: #d9a520; stroke: #7a5a0a; stroke-width: 1; }
      .texto-placa { fill: #ffffff; font-weight: 600; }
      .rotulo { fill: #1d2733; }
      .detalhe { fill: #5b6b7c; font-size: 12px; }
      .vermelho { stroke: #c62828; stroke-width: 4; fill: none; stroke-linecap: round; }
      .preto { stroke: #212121; stroke-width: 4; fill: none; stroke-linecap: round; }
      .amarelo { stroke: #e0a800; stroke-width: 4; fill: none; stroke-linecap: round; }
      .resistor { fill: #e8d3a8; stroke: #6b5427; stroke-width: 1.5; }
      .faixa { stroke-width: 3; }
      .sonda { fill: #b0bec5; stroke: #607d8b; stroke-width: 1.5; }
      .cabo { fill: #37474f; }
    </style>
  </defs>

  <!-- Sonda do DS18B20 -->
  <rect class="sonda" x="30" y="150" width="110" height="34" rx="16"/>
  <text class="rotulo" x="85" y="215" text-anchor="middle">DS18B20</text>
  <text class="detalhe" x="85" y="233" text-anchor="middle">sonda inox</text>
  <rect class="cabo" x="140" y="158" width="70" height="18" rx="4"/>

  <!-- Fios saindo do cabo -->
  <path class="vermelho" d="M210,161 C 260,161 260,90 330,90 L 640,90"/>
  <path class="amarelo" d="M210,167 C 280,167 300,170 380,170 L 640,170"/>
  <path class="preto" d="M210,173 C 260,173 260,250 330,250 L 640,250"/>

  <text class="rotulo" x="300" y="78">vermelho: VCC</text>
  <text class="rotulo" x="300" y="160">amarelo: dado</text>
  <text class="rotulo" x="300" y="272">preto: GND</text>

  <!-- Resistor de 4,7 kΩ entre o dado e o VCC -->
  <path class="vermelho" d="M500,90 L500,104" style="stroke-width:2.5"/>
  <path class="amarelo" d="M500,156 L500,170" style="stroke-width:2.5"/>
  <rect class="resistor" x="490" y="104" width="20" height="52" rx="6"/>
  <line class="faixa" x1="490" y1="114" x2="510" y2="114" stroke="#f9a825"/>
  <line class="faixa" x1="490" y1="122" x2="510" y2="122" stroke="#6a1b9a"/>
  <line class="faixa" x1="490" y1="130" x2="510" y2="130" stroke="#c62828"/>
  <line class="faixa" x1="490" y1="146" x2="510" y2="146" stroke="#c9a227"/>
  <text class="rotulo" x="522" y="126">4,7 kΩ</text>
  <text class="detalhe" x="522" y="144">entre o dado e o VCC</text>

  <!-- ESP32 -->
  <rect class="placa" x="640" y="40" width="230" height="270" rx="10"/>
  <text class="texto-placa" x="755" y="300" text-anchor="middle">ESP32 DevKit V1</text>
  <rect class="pino" x="632" y="82" width="18" height="16" rx="2"/>
  <rect class="pino" x="632" y="162" width="18" height="16" rx="2"/>
  <rect class="pino" x="632" y="242" width="18" height="16" rx="2"/>
  <text class="texto-placa" x="662" y="95">3V3</text>
  <text class="texto-placa" x="662" y="175">GPIO 4 (D4)</text>
  <text class="texto-placa" x="662" y="255">GND</text>

  <text class="detalhe" x="30" y="320">No Arduino Uno: vermelho no 5V, preto no GND, amarelo no pino digital 2, com o mesmo resistor.</text>
  <text class="detalhe" x="30" y="340">Módulos do DS18B20 com plaquinha e três pinos já trazem o resistor.</text>
</svg>
