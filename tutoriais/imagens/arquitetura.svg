<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="14">
  <title>Arquitetura da Rede de Telemetria do Espaço CRIA</title>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4a5a"/>
    </marker>
    <style>
      .caixa { stroke: #3b4a5a; stroke-width: 1.5; }
      .no { fill: #eaf3fb; }
      .servidor { fill: #eef7ee; }
      .usb { fill: #fdf3e6; }
      .painel { fill: #ffffff; }
      .titulo { font-weight: 600; fill: #1d2733; }
      .detalhe { fill: #5b6b7c; font-size: 12px; }
      .linha { stroke: #3b4a5a; stroke-width: 1.6; fill: none; marker-end: url(#seta); }
      .rotulo { fill: #1f6fb2; font-size: 12px; font-weight: 600; }
      .grupo { fill: none; stroke: #9aa8b6; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .grupo-nome { fill: #5b6b7c; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; }
    </style>
  </defs>

  <!-- Servidor da escola -->
  <rect class="grupo" x="300" y="20" width="490" height="395" rx="12"/>
  <text class="grupo-nome" x="316" y="42">SERVIDOR DA ESCOLA (Linux, no-break, IP fixo)</text>

  <rect class="caixa servidor" x="315" y="60" width="140" height="65" rx="8"/>
  <text class="titulo" x="385" y="87" text-anchor="middle">Mosquitto</text>
  <text class="detalhe" x="385" y="106" text-anchor="middle">broker MQTT, 1883</text>

  <rect class="caixa servidor" x="505" y="60" width="270" height="65" rx="8"/>
  <text class="titulo" x="640" y="87" text-anchor="middle">Servidor da telemetria</text>
  <text class="detalhe" x="640" y="106" text-anchor="middle">Node.js, Fastify e Socket.IO, porta 3000</text>

  <rect class="caixa servidor" x="315" y="170" width="140" height="65" rx="8"/>
  <text class="titulo" x="385" y="197" text-anchor="middle">chrony</text>
  <text class="detalhe" x="385" y="216" text-anchor="middle">hora dos nós (NTP), 123</text>

  <rect class="caixa servidor" x="505" y="170" width="125" height="65" rx="8"/>
  <text class="titulo" x="567" y="197" text-anchor="middle">InfluxDB 2</text>
  <text class="detalhe" x="567" y="216" text-anchor="middle">as leituras, 8086</text>

  <rect class="caixa servidor" x="650" y="170" width="125" height="65" rx="8"/>
  <text class="titulo" x="712" y="197" text-anchor="middle">Fotos</text>
  <text class="detalhe" x="712" y="216" text-anchor="middle">pastas por dia</text>

  <rect class="caixa servidor" x="315" y="350" width="460" height="45" rx="8"/>
  <text class="detalhe" x="545" y="377" text-anchor="middle">Backup diário do banco no cartão microSD (systemd)</text>

  <!-- Painel -->
  <rect class="caixa painel" x="840" y="60" width="140" height="65" rx="8"/>
  <text class="titulo" x="910" y="87" text-anchor="middle">Painel web</text>
  <text class="detalhe" x="910" y="106" text-anchor="middle">navegador, CSV</text>

  <!-- Nós e placas -->
  <rect class="caixa no" x="20" y="60" width="210" height="65" rx="8"/>
  <text class="titulo" x="125" y="87" text-anchor="middle">Nó ESP32</text>
  <text class="detalhe" x="125" y="106" text-anchor="middle">CriaTelemetria: DS18B20, pH...</text>

  <rect class="caixa no" x="20" y="170" width="210" height="65" rx="8"/>
  <text class="titulo" x="125" y="197" text-anchor="middle">Câmera ESP32-CAM</text>
  <text class="detalhe" x="125" y="216" text-anchor="middle">horta/no3, foto a cada 10 min</text>

  <rect class="caixa usb" x="20" y="290" width="95" height="65" rx="8"/>
  <text class="titulo" x="67" y="317" text-anchor="middle">Placa USB</text>
  <text class="detalhe" x="67" y="336" text-anchor="middle">Uno ou ESP32</text>

  <rect class="caixa usb" x="135" y="290" width="95" height="65" rx="8"/>
  <text class="titulo" x="182" y="317" text-anchor="middle">Notebook</text>
  <text class="detalhe" x="182" y="336" text-anchor="middle">gateway.py</text>

  <!-- Ligações -->
  <path class="linha" d="M230,92 L313,92"/>
  <text class="rotulo" x="271" y="85" text-anchor="middle">MQTT</text>
  <text class="rotulo" x="271" y="110" text-anchor="middle">Wi-Fi</text>

  <path class="linha" d="M455,92 L503,92"/>
  <path class="linha" d="M567,125 L567,168"/>
  <path class="linha" d="M712,125 L712,168"/>

  <path class="linha" d="M230,185 L262,185 L262,148 L480,148 L480,110 L503,110"/>
  <text class="rotulo" x="372" y="142" text-anchor="middle">HTTP: fotos</text>

  <path class="linha" d="M115,322 L133,322"/>
  <text class="rotulo" x="125" y="282" text-anchor="middle">USB</text>

  <path class="linha" d="M230,322 L490,322 L490,117 L503,117"/>
  <text class="rotulo" x="370" y="315" text-anchor="middle">HTTP: leituras, com a senha do projeto</text>

  <path class="linha" d="M775,92 L838,92"/>
  <text class="rotulo" x="806" y="85" text-anchor="middle">ao vivo</text>
</svg>
