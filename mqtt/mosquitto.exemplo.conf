# Configuração do broker da rede de telemetria do Espaço CRIA.
#
# O instalador (servidor/base/instalar.sh) copia este arquivo para
# /etc/mosquitto/conf.d/cria.conf. Não há senha aqui: elas ficam em
# /etc/mosquitto/senhas, criado com o mosquitto_passwd.
#
# A persistência (que guarda as mensagens com retain, como o status dos nós,
# quando o broker reinicia) já vem ligada no /etc/mosquitto/mosquitto.conf do
# Debian e do Ubuntu, com "persistence true". Por isso ela não se repete aqui.
#
# Regras dos tópicos e dos usuários: mqtt/catalogo-topicos.md.

# Porta MQTT padrão, aberta em todas as interfaces de rede deste computador.
listener 1883

# Ninguém se conecta sem usuário e senha.
allow_anonymous false
password_file /etc/mosquitto/senhas

# Cada projeto só lê e escreve dentro de cria/<projeto>/.
acl_file /etc/mosquitto/acl

# Guarda as leituras para quem assina com sessão persistente (clean session
# desligado e identificador fixo) enquanto ele estiver desconectado, inclusive
# as de QoS 0, que é como os nós publicam. É o que protege os dados quando o
# servidor da telemetria reinicia, ou quando o broker volta antes dele e os nós
# reenviam a fila. O servidor (servidor/src/assinante.js) assina dessa forma, com
# QoS 0: veja decisoes/2026-10-18-servidor-assina-com-qos-0.md.
# 20000 mensagens equivalem a umas 4 h da rede inteira.
queue_qos0_messages true
max_queued_messages 20000
