# Servidor de hora (NTP) da rede da telemetria.
# O instalador copia este arquivo para /etc/chrony/conf.d/cria.conf.
#
# A rede da telemetria não tem internet. Com a linha "local", o chrony continua
# fornecendo a hora do relógio deste computador mesmo sem nenhuma fonte externa.
# Para a latência e para a ordem das leituras, o que importa é que todos os nós
# usem o mesmo relógio, o deste servidor. Quando houver internet, o chrony
# acerta esse relógio pelas fontes públicas configuradas no chrony.conf.
local stratum 10

# Atende as três faixas de endereços de redes privadas. A rede do ponto de
# acesso dedicado da telemetria está numa delas.
allow 10.0.0.0/8
allow 172.16.0.0/12
allow 192.168.0.0/16
